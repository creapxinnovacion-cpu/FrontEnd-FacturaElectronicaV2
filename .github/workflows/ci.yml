name: 🚀 Frontend CI - Integración Continua

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  # =========================================================================
  # PILAR 1 & 2: Calidad de Código, Linting y Auditoría de Seguridad
  # =========================================================================
  quality-check:
    name: 🔍 Linting y Auditoría de Código
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Entorno Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Instalación Determinista de Dependencias (npm ci)
        run: npm ci

      - name: 🛡️ Auditoría de Seguridad de Dependencias (SAST)
        run: npm audit --audit-level=high
        continue-on-error: true # Notifica vulnerabilidades sin bloquear CI en parches no disponibles

      - name: 🧹 Análisis Estático de Código (ESLint)
        run: npm run lint

  # =========================================================================
  # PILAR 3: Compilación Determinista y Verificación de Bundle
  # =========================================================================
  build-verification:
    name: 🏗️ Compilación y Verificación de Artefactos (Vite)
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Entorno Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Instalar Dependencias
        run: npm ci

      - name: ⚡ Compilar Bundle de Producción (Vite Build)
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: https://api.factura.tudominio.com/api
        run: npm run build

      - name: 📤 Almacenar Artefactos de Distribución (dist)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 5
