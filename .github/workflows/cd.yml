name: 🚢 Frontend CD - Despliegue Continuo

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*.*.*' ]

permissions:
  contents: read
  packages: write # Para publicar imágenes en GitHub Container Registry (ghcr.io)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/svfe-frontend

jobs:
  # =========================================================================
  # PILAR 4: Empaquetado en Contenedores Inmutables y Registro OCI
  # =========================================================================
  docker-build-push:
    name: 🐳 Construcción y Publicación de Imagen Docker
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🔧 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Iniciar Sesión en GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extraer Metadatos y Tags Semánticos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 🏗️ Construir y Publicar Imagen Multi-stage (Docker + Nginx)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # PILAR 5: Despliegue Automatizado y Health Checks
  # =========================================================================
  deploy:
    name: 🚀 Despliegue a Producción y Health Check
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 🌐 Disparar Webhook de Despliegue (Render / Portainer / VPS)
        id: deploy_trigger
        run: |
          echo "Iniciando despliegue automatizado..."
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}")
            if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 204 ]; then
              echo "✅ Webhook de despliegue ejecutado con éxito (HTTP $RESPONSE)."
            else
              echo "⚠️ El webhook respondió con HTTP $RESPONSE. Revisa tu panel de hosting."
            fi
          else
            echo "ℹ️ Secrect 'DEPLOY_WEBHOOK_URL' no configurado. Imagen disponible en ghcr.io lista para deploy manual o git-watch."
          fi

      - name: 🩺 Verificación de Disponibilidad (Health Check)
        run: |
          echo "Esperando inicio de servicios (15s)..."
          sleep 15
          if [ -n "${{ secrets.PRODUCTION_URL }}" ]; then
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PRODUCTION_URL }}" || echo "000")
            echo "Estado HTTP de la aplicación en producción: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 304 ]; then
              echo "✅ La aplicación web está activa y respondiendo correctamente."
            else
              echo "⚠️ Alerta: El endpoint respondió con código $HTTP_STATUS."
            fi
          fi
